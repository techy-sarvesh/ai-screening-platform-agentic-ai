<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Custom Interview | AI Candidate Screening Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --card-border: #222f4d;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(135deg, rgba(19, 27, 46, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        header {
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .candidate-info {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .candidate-name {
            color: var(--text-main);
            font-weight: 600;
        }

        .section-tag {
            display: inline-block;
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 1rem;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-card:hover {
            border-color: rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(168, 85, 247, 0.1);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-main);
        }

        .text-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            padding: 1rem 1.25rem;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 140px;
            outline: none;
            transition: all 0.2s ease;
        }

        .text-input:focus {
            border-color: var(--accent-secondary);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 14px;
            padding: 1.25rem 2rem;
            font-size: 1.15rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(168, 85, 247, 0.4);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Custom Interview</h1>
            <div class="candidate-info">
                Position: <span class="candidate-name">{{ job_title }}</span> | Candidate: <span class="candidate-name">{{ candidate_name }}</span>
            </div>
        </header>

        <form action="/interview/{{ token }}/submit" method="POST">
            {% for q in questions %}
            <div class="question-card">
                <span class="section-tag">{{ q.topic }}</span>
                <div class="question-text">{{ loop.index }}. {{ q.question }}</div>
                <textarea class="text-input" name="{{ q.id }}" placeholder="Provide your detailed answer here..." required></textarea>
            </div>
            {% endfor %}

            <button type="submit" class="submit-btn">Submit Interview Responses</button>
        </form>
    </div>
</body>
</html>
